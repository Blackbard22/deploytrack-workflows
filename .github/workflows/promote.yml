name: DeployTrack — Promote

# Reusable promote: retag one build_id to an environment (no rebuild).
# Target must appear in resolved branches and must not be index 0 (CI branch).
# Index 0 is how DeployTrack finishes an import started from its UI: the
# `import` job retags that pending import (register-build action, retag-only
# mode). For any other build it has nothing to import and does nothing.
# Promoting to the last branch (production) also publishes a GitHub Release
# for the build's version at its commit (scripts/publish-release.ps1).
#
#   jobs:
#     promote:
#       uses: Blackbard22/deploytrack-workflows/.github/workflows/promote.yml@v1
#       with:
#         tracker_url: ${{ vars.TRACKER_URL }}
#         project_id: ${{ vars.TRACKER_PROJECT_ID }}
#         build_id: ${{ inputs.build_id }}
#         environment: ${{ inputs.environment }}
#       secrets: inherit

on:
  workflow_call:
    inputs:
      tracker_url:
        description: DeployTrack API base URL
        required: true
        type: string
      project_id:
        description: DeployTrack project id
        required: true
        type: string
      build_id:
        description: DeployTrack build_id to promote
        required: true
        type: string
      environment:
        description: Target environment / branch (e.g. staging, production)
        required: true
        type: string
    secrets:
      CICD_WEBHOOK_SECRET:
        required: true

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  setup:
    # Self-hosted Windows runner like promote; the steps run in Git Bash with
    # yq from setup-tools.ps1.
    runs-on: self-hosted
    outputs:
      should_promote: ${{ steps.guard.outputs.should_promote }}
      is_ci_branch: ${{ steps.guard.outputs.is_ci_branch }}
      predecessor: ${{ steps.guard.outputs.predecessor }}
      is_last: ${{ steps.guard.outputs.is_last }}
      component_count: ${{ steps.guard.outputs.component_count }}
      branches: ${{ steps.parse.outputs.branches }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout caller
        uses: actions/checkout@v4

      - name: Checkout workflows scripts
        if: hashFiles('scripts/resolve-config.sh') == ''
        uses: actions/checkout@v4
        with:
          repository: Blackbard22/deploytrack-workflows
          # Same tag callers pin (@v1), so scripts match this workflow's version.
          ref: v1
          path: _deploytrack_workflows
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: true

      - name: Install tools
        shell: powershell
        run: |
          $script = 'scripts/setup-tools.ps1'
          if (-not (Test-Path $script)) { $script = '_deploytrack_workflows/scripts/setup-tools.ps1' }
          & (Resolve-Path $script)

      - name: Tool versions
        run: |
          command -v bash yq
          yq --version

      - name: Parse .deploytrack.yaml
        id: parse
        run: |
          SCRIPT=scripts/resolve-config.sh
          if [ ! -f "$SCRIPT" ]; then
            SCRIPT=_deploytrack_workflows/scripts/resolve-config.sh
          fi
          bash "$SCRIPT"

      - name: Guard environment against branches
        id: guard
        env:
          TARGET_ENV: ${{ inputs.environment }}
          BRANCHES: ${{ steps.parse.outputs.branches }}
          COMPONENTS: ${{ steps.parse.outputs.components }}
        run: |
          set -euo pipefail
          TARGET="$(printf '%s' "$TARGET_ENV" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          echo "resolved branches=$BRANCHES target=$TARGET" >&2

          should_promote=false
          is_ci_branch=false
          predecessor=""
          i=0
          found=false
          while IFS= read -r b; do
            bl="$(printf '%s' "$b" | tr '[:upper:]' '[:lower:]')"
            if [[ "$bl" == "$TARGET" ]]; then
              found=true
              if [[ "$i" -gt 0 ]]; then
                should_promote=true
                predecessor="$(printf '%s' "$BRANCHES" | yq -r ".[$((i - 1))]")"
              else
                is_ci_branch=true
                echo "Target '$TARGET' is the CI branch (branches index 0) — no promote; the import job finishes a pending import if there is one" >&2
              fi
              break
            fi
            i=$((i + 1))
          done < <(printf '%s' "$BRANCHES" | yq -r '.[]')

          if [[ "$found" != true ]]; then
            echo "Target '$TARGET' is not in branches=$BRANCHES — no-op" >&2
          fi

          # The last branch is production: promoting there publishes a GitHub
          # Release. Tags carry the component name when there is more than one.
          total="$(printf '%s' "$BRANCHES" | yq -r 'length')"
          is_last=false
          if [[ "$should_promote" == true && "$i" -eq $((total - 1)) ]]; then
            is_last=true
          fi
          component_count="$(printf '%s' "${COMPONENTS:-[]}" | yq -r 'length')"

          {
            echo "should_promote=$should_promote"
            echo "is_ci_branch=$is_ci_branch"
            echo "predecessor=$predecessor"
            echo "is_last=$is_last"
            echo "component_count=$component_count"
          } >> "$GITHUB_OUTPUT"

  # An image built outside DeployTrack and imported from its UI: retag it to
  # its allocated version with the workflow token and report the result.
  # Managed builds and finished imports answer "nothing to import".
  import:
    needs: setup
    if: needs.setup.outputs.is_ci_branch == 'true'
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout workflows scripts
        uses: actions/checkout@v4
        with:
          repository: Blackbard22/deploytrack-workflows
          # Same tag callers pin (@v1), so scripts match this workflow's version.
          ref: v1
          path: _deploytrack_workflows
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: true

      # Git Bash and jq for the action's bash step.
      - name: Install tools
        shell: powershell
        run: |
          & (Resolve-Path '_deploytrack_workflows/scripts/setup-tools.ps1')

      - name: Import pending build
        uses: Blackbard22/deploytrack-workflows/register-build@v1
        with:
          tracker_url: ${{ inputs.tracker_url }}
          token: ${{ secrets.CICD_WEBHOOK_SECRET }}
          build_id: ${{ inputs.build_id }}
          registry_token: ${{ secrets.GITHUB_TOKEN }}

  promote:
    needs: setup
    if: needs.setup.outputs.should_promote == 'true'
    runs-on: self-hosted
    permissions:
      contents: write
      packages: write
      id-token: write
    defaults:
      run:
        shell: powershell
    steps:
      - name: Resolve build image
        id: resolve
        env:
          TRACKER_URL: ${{ inputs.tracker_url }}
          TRACKER_TOKEN: ${{ secrets.CICD_WEBHOOK_SECRET }}
          BUILD_ID: ${{ inputs.build_id }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          $ErrorActionPreference = 'Stop'
          trap { [System.IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'deploytrack-error.txt'), "$_"); break }
          $utf8 = New-Object System.Text.UTF8Encoding $false
          if (-not $env:BUILD_ID) { throw 'build_id input is required' }
          if (-not $env:ENVIRONMENT) { throw 'environment input is required' }

          $headers = @{ 'Content-Type' = 'application/json' }
          if ($env:TRACKER_TOKEN) {
            $headers['Authorization'] = "Bearer $($env:TRACKER_TOKEN)"
          }

          $build = Invoke-RestMethod -Method GET -Uri "$($env:TRACKER_URL)/api/builds/$($env:BUILD_ID)" -Headers $headers
          $dockerImage = [string]$build.docker_image
          if (-not $dockerImage -and $build.build) {
            $dockerImage = [string]$build.build.docker_image
          }
          if ([string]::IsNullOrWhiteSpace($dockerImage)) { throw 'build has no docker_image' }
          $sourceDigest = [string]$build.source_digest
          if (-not $sourceDigest -and $build.build) {
            $sourceDigest = [string]$build.build.source_digest
          }
          $parts = $dockerImage -split ':', 2
          $envName = $env:ENVIRONMENT.Trim().ToLowerInvariant()
          $envTag = "$($parts[0]):$envName"

          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "docker_image=$dockerImage" + [Environment]::NewLine, $utf8)
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "env_tag=$envTag" + [Environment]::NewLine, $utf8)
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "image_repo=$($parts[0])" + [Environment]::NewLine, $utf8)
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "source_digest=$($sourceDigest.Trim())" + [Environment]::NewLine, $utf8)
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=$($build.version)" + [Environment]::NewLine, $utf8)
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "component=$($build.component)" + [Environment]::NewLine, $utf8)
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "commit_sha=$($build.commit_sha)" + [Environment]::NewLine, $utf8)
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "build_number=$($build.build_number)" + [Environment]::NewLine, $utf8)
          Write-Host "Promote build $($env:BUILD_ID) component=$($build.component) $dockerImage -> $envTag"

      - name: Login to GHCR
        id: login
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          trap { [System.IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'deploytrack-error.txt'), "$_"); break }
          $utf8 = New-Object System.Text.UTF8Encoding $false
          $user = [string]$env:GHCR_USERNAME
          $token = [string]$env:GHCR_TOKEN
          if ([string]::IsNullOrWhiteSpace($user)) { throw 'github.actor is empty' }
          if ([string]::IsNullOrWhiteSpace($token)) { throw 'GITHUB_TOKEN is empty; the caller must grant packages: write' }
          $user = $user.Trim()
          $token = $token.Trim()
          # A fresh config also loses the CLI plugins (buildx) that live beside
          # the usual one (Docker Desktop: ~/.docker/cli-plugins), so carry
          # only cliPluginsExtraDirs over, plus that directory.
          $orig = $env:DOCKER_CONFIG
          if ([string]::IsNullOrWhiteSpace($orig)) { $orig = Join-Path $env:USERPROFILE '.docker' }
          $pluginDirs = @()
          try {
            $origCfg = Get-Content -Raw -Path (Join-Path $orig 'config.json') -ErrorAction Stop | ConvertFrom-Json
            if ($origCfg.cliPluginsExtraDirs) { $pluginDirs += @($origCfg.cliPluginsExtraDirs) }
          } catch {}
          $pluginDirs += (Join-Path $orig 'cli-plugins')
          $cfg = Join-Path $env:RUNNER_TEMP 'docker-config'
          New-Item -ItemType Directory -Force -Path $cfg | Out-Null
          $cfgJson = @{ cliPluginsExtraDirs = @($pluginDirs | Select-Object -Unique) } | ConvertTo-Json -Compress
          [System.IO.File]::WriteAllText((Join-Path $cfg 'config.json'), $cfgJson, $utf8)
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "DOCKER_CONFIG=$cfg" + [Environment]::NewLine, $utf8)
          $env:DOCKER_CONFIG = $cfg
          $patFile = Join-Path $env:RUNNER_TEMP 'ghcr.pat'
          [System.IO.File]::WriteAllText($patFile, $token)
          try {
            cmd /c "docker login ghcr.io -u `"$user`" --password-stdin < `"$patFile`""
            if ($LASTEXITCODE -ne 0) { throw 'docker login ghcr.io failed' }
          } finally {
            Remove-Item -Force $patFile -ErrorAction SilentlyContinue
          }

      # Registry-side copy with buildx imagetools: the env tag gets the
      # build's exact manifest (a multi-arch index keeps every platform and
      # its digest). Needs buildx on the runner (Docker Desktop ships it).
      - name: Retag image for environment
        id: retag
        env:
          DOCKER_IMAGE: ${{ steps.resolve.outputs.docker_image }}
          IMAGE_REPO: ${{ steps.resolve.outputs.image_repo }}
          SOURCE_DIGEST: ${{ steps.resolve.outputs.source_digest }}
          ENV_TAG: ${{ steps.resolve.outputs.env_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          trap { [System.IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'deploytrack-error.txt'), "$_"); break }
          $source = $env:DOCKER_IMAGE
          # Imported builds record the digest they were imported at; the
          # version tag must still point there.
          if ($env:SOURCE_DIGEST) {
            $manifest = docker buildx imagetools inspect $env:DOCKER_IMAGE --format '{{json .Manifest}}'
            if ($LASTEXITCODE -ne 0) { throw "inspect $($env:DOCKER_IMAGE) failed" }
            $digest = [string](($manifest | Out-String) | ConvertFrom-Json).digest
            if ($digest -ne $env:SOURCE_DIGEST) {
              throw "version tag was overwritten: $($env:DOCKER_IMAGE) is $digest, the build was imported as $($env:SOURCE_DIGEST)"
            }
            # Copy by digest so a push between the check and the copy can't slip in.
            $source = "$($env:IMAGE_REPO)@$($env:SOURCE_DIGEST)"
          }
          docker buildx imagetools create -t $env:ENV_TAG $source
          if ($LASTEXITCODE -ne 0) { throw "imagetools create $($env:ENV_TAG) from $source failed" }

      - name: Record gated promote
        id: promote
        env:
          TRACKER_URL: ${{ inputs.tracker_url }}
          TRACKER_TOKEN: ${{ secrets.CICD_WEBHOOK_SECRET }}
          BUILD_ID: ${{ inputs.build_id }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          $ErrorActionPreference = 'Stop'
          trap { [System.IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'deploytrack-error.txt'), "$_"); break }
          $utf8 = New-Object System.Text.UTF8Encoding $false
          $envName = $env:ENVIRONMENT.Trim().ToLowerInvariant()
          $body = @{
            target_environment = $envName
            deployed_by        = 'github-actions'
          } | ConvertTo-Json -Compress

          $headers = @{ 'Content-Type' = 'application/json' }
          if ($env:TRACKER_TOKEN) {
            $headers['Authorization'] = "Bearer $($env:TRACKER_TOKEN)"
          }

          $uri = "$($env:TRACKER_URL)/api/builds/$($env:BUILD_ID)/promote"
          $resp = Invoke-RestMethod -Method POST -Uri $uri -Headers $headers -Body $body
          $resp | ConvertTo-Json -Depth 6
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "deployment_id=$($resp.id)" + [Environment]::NewLine, $utf8)
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "status=$($resp.status)" + [Environment]::NewLine, $utf8)

      - name: Checkout repository
        id: checkout_repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync environment branch to predecessor
        id: git_sync
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          PREDECESSOR: ${{ needs.setup.outputs.predecessor }}
        run: |
          $ErrorActionPreference = 'Stop'
          trap { [System.IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'deploytrack-error.txt'), "$_"); break }
          $utf8 = New-Object System.Text.UTF8Encoding $false
          $envName = $env:ENVIRONMENT.Trim()
          $pred = $env:PREDECESSOR.Trim()
          if ([string]::IsNullOrWhiteSpace($envName)) { throw 'environment is empty' }
          if ([string]::IsNullOrWhiteSpace($pred)) { throw 'predecessor is empty' }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin $pred
          $remoteEnv = git ls-remote --heads origin $envName

          if ($remoteEnv) {
            git fetch origin $envName
            git checkout -B $envName origin/$envName
            git merge --ff-only origin/$pred
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Fast-forward not possible; aligning $envName tip to origin/$pred"
              git reset --hard origin/$pred
              if ($LASTEXITCODE -ne 0) { throw "git reset --hard origin/$pred failed" }
              git push --force-with-lease origin HEAD:$envName
              if ($LASTEXITCODE -ne 0) { throw "git push --force-with-lease to $envName failed" }
              [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "sync_mode=reset" + [Environment]::NewLine, $utf8)
            } else {
              git push origin HEAD:$envName
              if ($LASTEXITCODE -ne 0) { throw "git push to $envName failed" }
              [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "sync_mode=fast-forward" + [Environment]::NewLine, $utf8)
            }
          } else {
            git checkout -B $envName origin/$pred
            git push -u origin HEAD:$envName
            if ($LASTEXITCODE -ne 0) { throw "git push creating $envName failed" }
            [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "sync_mode=created" + [Environment]::NewLine, $utf8)
          }

          $sha = (git rev-parse HEAD).Trim()
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "env_sha=$sha" + [Environment]::NewLine, $utf8)

      - name: Checkout workflows scripts
        if: needs.setup.outputs.is_last == 'true'
        uses: actions/checkout@v4
        with:
          repository: Blackbard22/deploytrack-workflows
          # Same tag callers pin (@v1), so scripts match this workflow's version.
          ref: v1
          path: _deploytrack_workflows
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: true

      # The promote has already happened; a Releases problem only warns.
      - name: Publish GitHub release
        id: release
        if: needs.setup.outputs.is_last == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMPONENT: ${{ steps.resolve.outputs.component }}
          COMPONENT_COUNT: ${{ needs.setup.outputs.component_count }}
          VERSION: ${{ steps.resolve.outputs.version }}
          COMMIT_SHA: ${{ steps.resolve.outputs.commit_sha }}
          BUILD_NUMBER: ${{ steps.resolve.outputs.build_number }}
          BUILD_ID: ${{ inputs.build_id }}
          DOCKER_IMAGE: ${{ steps.resolve.outputs.docker_image }}
          ENV_TAG: ${{ steps.resolve.outputs.env_tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $script = 'scripts/publish-release.ps1'
          if (-not (Test-Path $script)) { $script = '_deploytrack_workflows/scripts/publish-release.ps1' }
          & $script

      - name: Summary
        env:
          BUILD_ID: ${{ inputs.build_id }}
          ENVIRONMENT: ${{ inputs.environment }}
          PREDECESSOR: ${{ needs.setup.outputs.predecessor }}
          DEPLOYMENT_ID: ${{ steps.promote.outputs.deployment_id }}
          STATUS: ${{ steps.promote.outputs.status }}
          ENV_TAG: ${{ steps.resolve.outputs.env_tag }}
          ENV_SHA: ${{ steps.git_sync.outputs.env_sha }}
          SYNC_MODE: ${{ steps.git_sync.outputs.sync_mode }}
          IS_LAST: ${{ needs.setup.outputs.is_last }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          @"
          ### DeployTrack (promote — $($env:PREDECESSOR) → $($env:ENVIRONMENT))
          - **build_id:** $env:BUILD_ID
          - **deployment_id:** $env:DEPLOYMENT_ID
          - **status:** $env:STATUS
          - **Env tag:** ``$env:ENV_TAG``
          - **Git $($env:ENVIRONMENT) SHA:** ``$env:ENV_SHA``
          - **Git sync:** $env:SYNC_MODE
          "@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          if ($env:IS_LAST -eq 'true') {
            if ($env:RELEASE_OUTCOME -eq 'success' -and $env:RELEASE_URL) {
              "- **GitHub release:** [$($env:RELEASE_TAG)]($($env:RELEASE_URL))" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
            } else {
              "- **GitHub release:** not published ($($env:RELEASE_OUTCOME)); see the Publish GitHub release step. The promote itself succeeded." | Add-Content -Path $env:GITHUB_STEP_SUMMARY
            }
          }

      # One report for whichever step failed; each step's trap leaves its
      # error in deploytrack-error.txt. Best effort: a report that can't be
      # sent only warns, so the step that failed stays the run's error.
      - name: Report failed promote
        if: failure()
        env:
          TRACKER_URL: ${{ inputs.tracker_url }}
          TRACKER_TOKEN: ${{ secrets.CICD_WEBHOOK_SECRET }}
          PROJECT_ID: ${{ inputs.project_id }}
          BUILD_ID: ${{ inputs.build_id }}
          ENVIRONMENT: ${{ inputs.environment }}
          COMPONENT: ${{ steps.resolve.outputs.component }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          RESOLVE_OUTCOME: ${{ steps.resolve.outcome }}
          LOGIN_OUTCOME: ${{ steps.login.outcome }}
          RETAG_OUTCOME: ${{ steps.retag.outcome }}
          PROMOTE_OUTCOME: ${{ steps.promote.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout_repo.outcome }}
          GIT_SYNC_OUTCOME: ${{ steps.git_sync.outcome }}
        run: |
          $ErrorActionPreference = 'Stop'
          $errFile = Join-Path $env:RUNNER_TEMP 'deploytrack-error.txt'
          $err = ''
          if (Test-Path $errFile) { $err = (Get-Content -Raw -Encoding UTF8 $errFile).Trim() }
          $envName = ([string]$env:ENVIRONMENT).Trim().ToLowerInvariant()
          $buildId = 0
          [void][int]::TryParse(([string]$env:BUILD_ID).Trim(), [ref]$buildId)

          # Returns the HTTP status (0 when nothing answered); never throws.
          function Send-Report([string]$path, [hashtable]$body) {
            $headers = @{}
            if ($env:TRACKER_TOKEN) { $headers['Authorization'] = "Bearer $($env:TRACKER_TOKEN)" }
            $json = $body | ConvertTo-Json -Compress
            try {
              Invoke-RestMethod -Method POST -Uri "$($env:TRACKER_URL)$path" -Headers $headers -ContentType 'application/json; charset=utf-8' -Body ([System.Text.Encoding]::UTF8.GetBytes($json)) | Out-Null
              Write-Host "Reported the failure to DeployTrack ($path)"
              return 200
            } catch {
              $code = 0
              if ($_.Exception.Response) { $code = [int]$_.Exception.Response.StatusCode }
              Write-Warning "Could not report the failure to DeployTrack ($path, HTTP $code): $_"
              return $code
            }
          }
          function Send-CiFailure([string]$stage, [string]$message) {
            if ($message.Length -gt 2000) { $message = $message.Substring(0, 2000) }
            $body = @{ stage = $stage; environment = $envName; message = $message; run_url = $env:RUN_URL; workflow = 'promote' }
            if ($buildId -gt 0) { $body.build_id = $buildId }
            if ($env:COMPONENT) { $body.component = $env:COMPONENT }
            [void](Send-Report "/api/projects/$(([string]$env:PROJECT_ID).Trim())/ci-failures" $body)
          }

          if ($env:PROMOTE_OUTCOME -ne 'success') {
            # Nothing recorded yet: fail the deployment, which also ends the
            # dispatch DeployTrack is waiting on.
            $stage = 'promote'
            $steps = [ordered]@{ resolve = $env:RESOLVE_OUTCOME; login = $env:LOGIN_OUTCOME; retag = $env:RETAG_OUTCOME }
            foreach ($k in $steps.Keys) { if ($steps[$k] -eq 'failure') { $stage = $k; break } }
            if ($err.Length -gt 2000) { $err = $err.Substring(0, 2000) }
            $code = 422
            if ($buildId -gt 0) {
              $body = @{ build_id = $buildId; environment = $envName; status = 'failed'; deployed_by = 'github-actions'; stage = $stage; run_url = $env:RUN_URL }
              if ($err) { $body.error = $err }
              $code = Send-Report '/api/deployments' $body
            }
            # 422: e.g. an environment DeployTrack doesn't know. Still notify.
            if ($code -eq 422) {
              if (-not $err) { $err = "Promote to $envName failed at $stage" }
              Send-CiFailure $stage $err
            }
          } else {
            # The deployment is already recorded as a success; a failed one
            # would contradict it, so this is a warning about the branch.
            $what = 'a later step'
            if ($env:CHECKOUT_OUTCOME -eq 'failure') { $what = 'checking out the repository' }
            elseif ($env:GIT_SYNC_OUTCOME -eq 'failure') { $what = "syncing the $envName branch" }
            $message = "Promote to $envName was recorded, but $what failed"
            if ($err) { $message = "${message}: $err" }
            Send-CiFailure 'git_sync' $message
          }

  # setup failed (e.g. a broken .deploytrack.yaml), so no promote job ran:
  # report it as a failed deployment, which ends the dispatch DeployTrack is
  # waiting on. Best effort, like the promote job's report.
  report-setup-failure:
    needs: setup
    if: always() && needs.setup.result == 'failure'
    runs-on: self-hosted
    permissions: {}
    defaults:
      run:
        shell: powershell
    steps:
      - name: Report failed promote
        env:
          TRACKER_URL: ${{ inputs.tracker_url }}
          TRACKER_TOKEN: ${{ secrets.CICD_WEBHOOK_SECRET }}
          PROJECT_ID: ${{ inputs.project_id }}
          BUILD_ID: ${{ inputs.build_id }}
          ENVIRONMENT: ${{ inputs.environment }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = 'Stop'
          $envName = ([string]$env:ENVIRONMENT).Trim().ToLowerInvariant()
          $buildId = 0
          [void][int]::TryParse(([string]$env:BUILD_ID).Trim(), [ref]$buildId)
          $message = 'The promote workflow failed in setup (check .deploytrack.yaml); nothing was promoted'

          # Returns the HTTP status (0 when nothing answered); never throws.
          function Send-Report([string]$path, [hashtable]$body) {
            $headers = @{}
            if ($env:TRACKER_TOKEN) { $headers['Authorization'] = "Bearer $($env:TRACKER_TOKEN)" }
            $json = $body | ConvertTo-Json -Compress
            try {
              Invoke-RestMethod -Method POST -Uri "$($env:TRACKER_URL)$path" -Headers $headers -ContentType 'application/json; charset=utf-8' -Body ([System.Text.Encoding]::UTF8.GetBytes($json)) | Out-Null
              Write-Host "Reported the failure to DeployTrack ($path)"
              return 200
            } catch {
              $code = 0
              if ($_.Exception.Response) { $code = [int]$_.Exception.Response.StatusCode }
              Write-Warning "Could not report the failure to DeployTrack ($path, HTTP $code): $_"
              return $code
            }
          }

          $code = 422
          if ($buildId -gt 0) {
            $code = Send-Report '/api/deployments' @{ build_id = $buildId; environment = $envName; status = 'failed'; deployed_by = 'github-actions'; stage = 'promote_setup'; error = $message; run_url = $env:RUN_URL }
          }
          # 422: e.g. an environment DeployTrack doesn't know. Still notify.
          if ($code -eq 422) {
            $body = @{ stage = 'promote_setup'; environment = $envName; message = $message; run_url = $env:RUN_URL; workflow = 'promote' }
            if ($buildId -gt 0) { $body.build_id = $buildId }
            [void](Send-Report "/api/projects/$(([string]$env:PROJECT_ID).Trim())/ci-failures" $body)
          }
